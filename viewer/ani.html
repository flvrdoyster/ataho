    <link rel="stylesheet" href="../fonts.css">
    <link rel="stylesheet" href="page.css">
    <link rel="stylesheet" href="../world/ui.css">
    <link rel="stylesheet" href="video_player.css">
    <!-- 무대 비율(1280x720) — page.css의 기본값(640x480)을 덮어쓴다 -->

<body class="footer-fixed">
    <!-- Google Tag Manager (noscript) -->

            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="app">
        <div id="stage" class="stage">
            <div id="loading">Loading...</div>
        </div>
        <div id="controls"></div>
    </div>

    <!-- world/ui.js가 자기 이미지 자산(커서·프레임)을 찾는 기준 -->
    <script>window.WORLD_BASE = '../world/';</script>

    <!-- 자막(VTT) 파싱·동기화 — scene.html의 장면 뷰어와 공유 -->
    <script src="subtitles.js"></script>
    <!-- 공용 픽셀 UI 키트 — 미니게임(balance/sweep)과 같은 것. UIMuteButton을 쓴다 -->
    <script src="../world/ui.js"></script>
    <script src="video_player.js"></script>
    <script src="ani/ani.js"></script>
    <script>
        const config = VideoPlayer.players.ani;
        if (!config) {
            document.getElementById('loading').textContent = '영상 정보를 불러오지 못했습니다.';
        } else {
            new VideoPlayer('#stage', '#controls').load(config);
        }
    </script>
