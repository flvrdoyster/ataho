name: ga4-dashboard

on:
  schedule:
    - cron: '0 20 * * *'   # 05:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-analytics-data google-auth requests

      - name: Fetch GA4 data
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: '516513119'
          GA4_BLOG_PROPERTY_ID: '549191220'
          FEEDBACK_SHEET_ID: '10IdRL3n0wKav9TvPbS0kkm5Pq6fAaMxDNWauTNYy5cE'
        run: python scripts/ga4_dashboard.py

      - name: Archive GA4 data
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: '516513119'
          GA4_BLOG_PROPERTY_ID: '549191220'
        run: python scripts/ga4_archive.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/ dashboard/archive/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "GA4 대시보드 데이터 갱신 $(date -u +%F)"
            git push
          fi
