name: GA4 Daily Dashboard

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-analytics-data google-auth

      - name: Fetch GA4 data
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: '516513119'
        run: python scripts/ga4_dashboard.py

      # 페이지(dashboard/index.html·dashboard.css·dashboard.js)는 손으로 관리한다.
      # 이 워크플로우는 데이터 파일만 건드리므로 add 대상도 그것 하나뿐이다.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/ga4.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "GA4 대시보드 데이터 갱신 $(date -u +%F)"
            git push
          fi
