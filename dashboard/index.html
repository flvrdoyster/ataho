<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://atah.io/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="preload"
        href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/KoddiUDOnGothic-Regular.woff" as="font"
        type="font/woff" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/KoddiUDOnGothic-Bold.woff"
        as="font" type="font/woff" crossorigin>
    <link rel="stylesheet" href="../fonts.css">
    <link rel="stylesheet" href="../footer.css">
    <!-- theme.css 가 먼저 — 색·서체·크기 토큰을 정의하고, dashboard.css 는 그 값을 쓴다.
         스킨을 바꿀 땐 이 한 줄만 다른 테마 파일로 갈아끼우면 된다(위의 폰트 preload도 함께). -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <title>대시보드 : atah.io</title>
    <!-- GTM 없음: 이 페이지가 스스로를 집계하면 대시보드가 자기 방문으로 부풀어서 뺐습니다. -->
</head>

<body class="footer-static">
    <div class="container">
        <header class="dash-header">
            <h1>atah.io 대시보드</h1>
            <p class="dash-sub">사이트 지표를 매일 아침 자동으로 모아 둡니다.</p>
            <!-- 탭은 dashboard.js가 데이터 파일 개수만큼 만든다 -->
            <nav class="dash-nav" id="dash-nav" aria-label="대시보드 종류"></nav>
        </header>

        <main id="dash-panels" class="dash-main">
            <noscript>
                <p class="empty">이 대시보드는 자바스크립트로 그립니다.</p>
            </noscript>
        </main>
    </div>

    <script src="data/ga4.js"></script>
    <script src="data/blog.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
    <script src="dashboard.js"></script>
    <script src="../footer.js"></script>
</body>

</html>
